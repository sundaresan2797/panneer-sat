{% extends "base.html" %}

{% block content %}

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">{{ site.company_name }}</span>
    <h1>{{ content.h1 }}</h1>
    <p class="page-hero-subtitle">{{ content.subtitle }}</p>
  </div>
</section>

<section class="gallery-section">
  <div class="container">
    <div class="gallery-filters" role="tablist">
      <button class="gallery-filter is-active" data-filter="all" type="button">{{ ui.all_label }}</button>
      {% for cat in content.categories %}
      <button class="gallery-filter" data-filter="{{ cat | lower | replace(' ', '-') }}" type="button">{{ cat }}</button>
      {% endfor %}
    </div>

    <div class="gallery-grid" id="galleryGrid">
      {% for i in range(1, 13) %}
      <button class="gallery-item" type="button" data-full="/static/images/gallery/gallery-{{ '%02d' % i }}.jpg" data-filter="all" aria-label="Open image {{ i }}">
        <img src="/static/images/gallery/gallery-{{ '%02d' % i }}.jpg" alt="Sri Annamalayar Transport & Logistics operations photo {{ i }}" loading="lazy" onerror="this.closest('.gallery-item').classList.add('img-fallback')">
        <div class="gallery-item-fallback" aria-hidden="true"></div>
      </button>
      {% endfor %}
    </div>

    <p class="gallery-note">{{ content.note }}</p>
  </div>
</section>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
  <img id="lightboxImage" src="" alt="">
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/gallery.js" defer></script>
{% endblock %}
